# This workflow will install Python dependencies, lint code, perform security check, run tests with coverage
# After steps above went successfully it will then authenticate to GCP, build an image and push it to GCP Artifact Registry
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: "europe-central2"
  GCP_PROJECT_ID: "project-8f2122a5-c322-493d-a58"
  AR_URI: "europe-central2-docker.pkg.dev" 
  AR_REPOSITORY: "gamma" 
  IMAGE_NAME: "gamma-backend"

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install pytest pytest-cov
        pip install pip-audit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with ruff
      run: |
        ruff check . --select=E9,F63,F7,F82 --output-format=full --statistics
        ruff check . --exit-zero --line-length=127 --statistics
    - name: Security audit with pip-audit
      run: |
        pip-audit
    - name: Test with pytest
      run: |
        pytest --cov=api --cov-fail-under=80
    - name: Authenticate to GCP
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: ${{ secrets.GCP_WIP }}
        service_account: ${{ secrets.GCP_SA }}
    - name: Log in to GCP Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GCP_REGION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}
    - name: Build Docker image
      run: |
        docker build -t ${{ env.AR_URI }}/${{ env.GCP_PROJECT_ID }}/${{env.AR_REPOSITORY}}/${{ env.IMAGE_NAME }}:${{ github.sha }} ./
    - name: Push Docker image
      if: github.event_name == 'push'
      run: |
        docker push "${{ env.AR_URI }}/${{ env.GCP_PROJECT_ID }}/${{env.AR_REPOSITORY}}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
